name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm turbo build --filter=@haccp/api...

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm turbo build --filter=@haccp/web...

  validate-migrations:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haccp
          POSTGRES_PASSWORD: haccp
          POSTGRES_DB: haccp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U haccp -d haccp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations on fresh database
        run: pnpm --filter @haccp/api db:migrate:deploy
        env:
          DIRECT_DATABASE_URL: postgresql://haccp:haccp@localhost:5432/haccp

      # Guards both failure modes that let drizzle/meta drift out of sync with
      # the TS schema: a schema change committed without a migration, and a
      # hand-written migration the snapshots never learned about. Either one
      # makes the *next* generate diff against a stale snapshot and emit
      # destructive SQL, so catch it at the PR that introduces it.
      - name: Check for uncommitted schema drift
        run: pnpm --filter @haccp/api db:check
        env:
          DIRECT_DATABASE_URL: postgresql://haccp:haccp@localhost:5432/haccp

      - name: Fail if a migration was generated
        run: git diff --exit-code --stat -- apps/api/drizzle
