name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm turbo lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm turbo typecheck

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build API
        run: pnpm turbo build --filter=@haccp/api...

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Web
        run: pnpm turbo build --filter=@haccp/web...

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm turbo test

      # Deliberately after a build: Vitest only over-collects once dist is
      # populated, so running this on a clean tree would prove nothing.
      - name: Build emitting packages
        run: pnpm turbo build --filter=@haccp/api... --filter=@haccp/shared...

      - name: Assert each source test is discovered exactly once
        run: pnpm test:discovery

  validate-migrations:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haccp
          POSTGRES_PASSWORD: haccp
          POSTGRES_DB: haccp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U haccp -d haccp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Apply migrations on fresh database
        run: pnpm --filter @haccp/api db:migrate:deploy
        env:
          DIRECT_DATABASE_URL: postgresql://haccp:haccp@localhost:5432/haccp

      # Guards both failure modes that let drizzle/meta drift out of sync with
      # the TS schema: a schema change committed without a migration, and a
      # hand-written migration the snapshots never learned about. Either one
      # makes the *next* generate diff against a stale snapshot and emit
      # destructive SQL, so catch it at the PR that introduces it.
      - name: Check for uncommitted schema drift
        run: pnpm --filter @haccp/api db:check
        env:
          DIRECT_DATABASE_URL: postgresql://haccp:haccp@localhost:5432/haccp

      - name: Fail if a migration was generated
        run: git diff --exit-code --stat -- apps/api/drizzle
