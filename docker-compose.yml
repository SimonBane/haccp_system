services:
  postgres:
    image: postgres:16-alpine
    container_name: haccp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: haccp
      POSTGRES_PASSWORD: haccp
      POSTGRES_DB: haccp
    volumes:
      - haccp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haccp -d haccp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: haccp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - haccp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  haccp_postgres_data:
  haccp_redis_data:
